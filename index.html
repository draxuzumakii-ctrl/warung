<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dapur Pedas — Menu Makanan & Minuman</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  html, body { height:100%; overflow:hidden; }
  body {
    background: radial-gradient(circle at 15% 15%, #1c1c33, #0b0b14 65%);
    color:#fff; perspective:1600px;
  }
  .app { display:grid; grid-template-columns: 1fr 380px; grid-template-rows: 64px 1fr; height:100vh; }

  /* HEADER */
  header {
    grid-column: 1 / -1; display:flex; align-items:center; justify-content:space-between;
    padding:0 26px; background:rgba(255,255,255,0.05); backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,255,255,0.1); z-index:10;
  }
  header .logo { font-weight:900; font-size:1.2rem;
    background:linear-gradient(90deg,#ff7b54,#ffd369); -webkit-background-clip:text; color:transparent; }
  header .tagline { color:#888; font-size:.78rem; margin-left:14px; }
  .pill { padding:7px 16px; border-radius:30px; font-size:.75rem; font-weight:700;
    background:rgba(255,211,105,0.12); color:#ffd369; border:1px solid rgba(255,211,105,0.3); }

  /* MENU */
  .menu-area { overflow-y:auto; padding:24px 26px 30px; }
  .menu-area::-webkit-scrollbar { width:6px; }
  .menu-area::-webkit-scrollbar-thumb { background:#ff7b54; border-radius:10px; }
  .menu-title { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; }
  .menu-title h2 { font-size:1.4rem; color:#ffd369; }
  .menu-title span { color:#777; font-size:.8rem; }

  /* KATEGORI TAB */
  .tabs { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
  .tab {
    padding:8px 22px; border-radius:30px; cursor:pointer; font-size:.8rem; font-weight:700;
    border:1px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.05);
    color:#bbb; transition:.25s;
  }
  .tab:hover { background:rgba(255,123,84,0.2); color:#fff; }
  .tab.active {
    background:linear-gradient(135deg,#ff7b54,#ff4d6d); color:#fff;
    border-color:transparent; box-shadow:0 6px 20px rgba(255,77,109,0.5);
  }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:18px; perspective:1200px; }

  .card3d {
    border-radius:20px; overflow:hidden;
    background:linear-gradient(145deg,rgba(255,255,255,0.08),rgba(255,255,255,0.02));
    border:1px solid rgba(255,255,255,0.13);
    transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s, border-color .3s;
    transform-style:preserve-3d; display:flex; flex-direction:column;
    animation:fadeIn .35s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform:scale(.96); } to { opacity:1; transform:scale(1); } }
  .card3d:hover { box-shadow:0 22px 50px rgba(255,123,84,0.28); border-color:rgba(255,211,105,0.5); }

  .img-wrap { position:relative; height:125px; overflow:hidden; }
  .img-wrap img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s ease; }
  .card3d:hover .img-wrap img { transform:scale(1.13); }
  .img-wrap::after { content:''; position:absolute; inset:0;
    background:linear-gradient(to top,rgba(11,11,20,0.92),transparent 60%); }
  .badge { position:absolute; top:8px; left:8px; z-index:2; padding:4px 11px; border-radius:20px;
    font-size:.65rem; font-weight:700; background:linear-gradient(135deg,#ff7b54,#ff4d6d);
    box-shadow:0 4px 14px rgba(255,77,109,0.5); }
  .badge.drink { background:linear-gradient(135deg,#4dabf7,#3bc9db); }

  .card-body { padding:12px 14px 14px; display:flex; flex-direction:column; gap:7px; flex:1; }
  .card-body h3 { font-size:.95rem; color:#ffd369; }
  .card-body .desc { color:#999; font-size:.74rem; line-height:1.45; flex:1;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card-body .price { font-weight:800; font-size:1rem; color:#ff7b54; }
  .price-note { font-size:.66rem; color:#888; font-weight:400; }

  /* LEVEL (pedas / manis) */
  .level-row { display:flex; flex-direction:column; gap:5px; }
  .level-label { display:flex; justify-content:space-between; align-items:center; font-size:.68rem; color:#aaa; }
  .level-label .extra { color:#ff4d6d; font-weight:800; }
  .level-label .extra.free { color:#4dff88; }
  .level-btns { display:flex; gap:5px; flex-wrap:wrap; }
  .level-btn {
    width:26px; height:26px; border-radius:50%; border:1px solid rgba(255,255,255,0.2);
    background:rgba(255,255,255,0.06); color:#ddd; font-size:.68rem; font-weight:700;
    cursor:pointer; transition:.2s;
  }
  .level-btn:hover { background:rgba(255,123,84,0.3); }
  .level-btn.active { background:linear-gradient(135deg,#ff7b54,#ff4d6d); color:#fff;
    border-color:transparent; box-shadow:0 0 12px rgba(255,77,109,0.8); transform:scale(1.12); }
  .level-btn.sweet.active { background:linear-gradient(135deg,#4dabf7,#3bc9db);
    box-shadow:0 0 12px rgba(77,171,247,0.8); }

  .qty-row { display:flex; align-items:center; gap:7px; margin-top:2px; }
  .qty-box { display:flex; align-items:center; border-radius:20px; overflow:hidden;
    border:1px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.05); }
  .qty-box button { width:26px; height:26px; border:none; background:transparent;
    color:#ffd369; font-size:1rem; font-weight:700; cursor:pointer; transition:.2s; }
  .qty-box button:hover { background:rgba(255,211,105,0.18); }
  .qty-box .num { min-width:22px; text-align:center; font-weight:700; font-size:.8rem; }

  .add-btn {
    flex:1; padding:7px 0; border:none; border-radius:20px; cursor:pointer;
    font-weight:700; font-size:.75rem; color:#fff;
    background:linear-gradient(135deg,#ff7b54,#ff4d6d);
    box-shadow:0 4px 0 #b33a2a, 0 8px 18px rgba(255,77,109,0.35);
    transform:translateY(-2px); transition:.13s;
  }
  .add-btn.drink { background:linear-gradient(135deg,#4dabf7,#3bc9db);
    box-shadow:0 4px 0 #2b6cb0, 0 8px 18px rgba(77,171,247,0.35); }
  .add-btn:active { transform:translateY(2px); box-shadow:0 1px 0 #b33a2a; }

  /* CART */
  .cart {
    border-left:1px solid rgba(255,255,255,0.1);
    background:rgba(18,18,32,0.85); backdrop-filter:blur(20px);
    display:flex; flex-direction:column; box-shadow:-16px 0 50px rgba(0,0,0,0.45);
  }
  .cart-head { padding:18px 22px; border-bottom:1px solid rgba(255,255,255,0.1);
    display:flex; justify-content:space-between; align-items:center; }
  .cart-head h3 { font-size:1rem; color:#ffd369; }
  .cart-head .badge-num { background:linear-gradient(135deg,#ff7b54,#ff4d6d); color:#fff;
    font-size:.7rem; font-weight:900; padding:3px 11px; border-radius:20px;
    box-shadow:0 0 14px rgba(255,77,109,0.6); }

  .cart-list { flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .cart-list::-webkit-scrollbar { width:5px; }
  .cart-list::-webkit-scrollbar-thumb { background:#ff7b54; border-radius:10px; }

  .cart-item {
    display:flex; gap:10px; align-items:center;
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
    border-radius:14px; padding:8px 10px; animation:slideIn .28s ease;
  }
  @keyframes slideIn { from { opacity:0; transform:translateX(24px); } to { opacity:1; transform:translateX(0); } }
  .cart-item img { width:44px; height:44px; border-radius:10px; object-fit:cover; flex-shrink:0; }
  .cart-item .info { flex:1; min-width:0; }
  .cart-item .info h4 { font-size:.8rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cart-item .info small { color:#999; font-size:.66rem; display:block; }
  .cart-item .info small.lvl { color:#ff4d6d; font-weight:700; }
  .cart-item .info small.sweet { color:#4dabf7; font-weight:700; }
  .cart-item .info .sub { color:#ffd369; font-weight:700; font-size:.76rem; }
  .cart-item .qty-mini { display:flex; align-items:center; gap:5px; }
  .cart-item .qty-mini button {
    width:22px; height:22px; border-radius:50%; border:1px solid rgba(255,255,255,0.2);
    background:transparent; color:#ffd369; font-weight:700; cursor:pointer; font-size:.72rem; transition:.2s;
  }
  .cart-item .qty-mini button:hover { background:rgba(255,211,105,0.2); }
  .cart-item .qty-mini span { font-size:.76rem; font-weight:700; min-width:14px; text-align:center; }

  .cart-empty { text-align:center; color:#666; margin:auto; font-size:.85rem; line-height:1.7; }
  .cart-empty span { display:block; font-size:3rem; margin-bottom:10px; opacity:.35; }

  .cart-foot { padding:16px 22px 20px; border-top:1px solid rgba(255,255,255,0.1);
    background:rgba(255,255,255,0.03); }
  .total-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .total-row span { color:#aaa; font-size:.85rem; }
  .total-row .total { font-size:1.35rem; font-weight:900;
    background:linear-gradient(90deg,#ff7b54,#ffd369); -webkit-background-clip:text; color:transparent; }
  .checkout-btn {
    width:100%; padding:13px 0; border:none; border-radius:14px; cursor:pointer;
    font-weight:800; font-size:.88rem; color:#fff;
    background:linear-gradient(135deg,#25d366,#128c4a);
    box-shadow:0 6px 0 #0a5c30, 0 12px 26px rgba(37,211,102,0.32);
    transform:translateY(-3px); transition:.13s;
  }
  .checkout-btn:active { transform:translateY(3px); box-shadow:0 1px 0 #0a5c30; }
  .checkout-btn:disabled { opacity:.35; cursor:not-allowed; transform:none; box-shadow:none; }

  /* TOAST */
  .toast {
    position:fixed; bottom:26px; left:26px;
    background:linear-gradient(135deg,#ff7b54,#ff4d6d); color:#fff;
    padding:11px 24px; border-radius:30px; font-size:.82rem; font-weight:700;
    opacity:0; transform:translateY(20px); pointer-events:none;
    transition:.3s; z-index:400; box-shadow:0 14px 34px rgba(255,77,109,0.5);
  }
  .toast.show { opacity:1; transform:translateY(0); }

  @media (max-width:900px) {
    .app { grid-template-columns:1fr; grid-template-rows:64px 1fr auto; }
    .cart { border-left:none; border-top:1px solid rgba(255,255,255,0.1); max-height:46vh; }
    .menu-area { padding:18px; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div style="display:flex;align-items:center;">
      <div class="logo">🍽️ DAPUR PEDAS</div>
      <div class="tagline">Makanan & Minuman · Level pedas & manis</div>
    </div>
    <div>
      <span class="pill">Level 5+ · +Rp 1.000/level</span>
    </div>
  </header>

  <main class="menu-area">
    <div class="menu-title">
      <h2 id="sectionTitle">Menu Makanan 🍛</h2>
      <span id="menuCount"></span>
    </div>

    <div class="tabs">
      <div class="tab active" data-cat="food">🍛 Makanan</div>
      <div class="tab" data-cat="drink">🥤 Minuman</div>
      <div class="tab" data-cat="all">📋 Semua</div>
    </div>

    <div class="grid" id="menuGrid"></div>
  </main>

  <aside class="cart">
    <div class="cart-head">
      <h3>🛒 Keranjang</h3>
      <span class="badge-num" id="cartCount">0 item</span>
    </div>
    <div class="cart-list" id="cartList"></div>
    <div class="cart-foot">
      <div class="total-row">
        <span>Total Harga</span>
        <span class="total" id="grandTotal">Rp 0</span>
      </div>
      <button class="checkout-btn" id="checkoutBtn" disabled>Checkout via WhatsApp 💬</button>
    </div>
  </aside>
</div>

<div class="toast" id="toast">Ditambahkan ✓</div>

<script>
/* ============ NOMOR WHATSAPP ============ */
const NOMOR_WA = '6285142926688'; // 085142926688

/* ============ ATURAN LEVEL PEDAS ============ */
const LEVEL_START = 5;
const LEVEL_STEP_PRICE = 1000;
const MAX_LEVEL = 10;

function levelExtra(level) {
  if (!level || level < LEVEL_START) return 0;
  return (level - LEVEL_START) * LEVEL_STEP_PRICE;
}

/* ============ DATA MENU ============ */
const PRODUCTS = [
  /* --- MAKANAN --- */
  { id:1, name:"Ayam Geprek Sambal Bawang", price:27000, badge:"Best Seller", cat:"food",
    desc:"Ayam crispy gurih, sambal bawang pedas nampol.",
    img:"https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?w=400&q=80", type:"spicy" },
  { id:2, name:"Nasi Goreng Spesial", price:25000, badge:"Favorit", cat:"food",
    desc:"Nasi goreng kampung dengan telur & ayam suwir.",
    img:"https://images.unsplash.com/photo-1512058564366-18510be2db19?w=400&q=80", type:"spicy" },
  { id:3, name:"Mie Goreng Jawa", price:23000, badge:"Murah", cat:"food",
    desc:"Mie goreng bumbu Jawa khas dengan sayuran segar.",
    img:"https://images.unsplash.com/photo-1585032226651-759b368d7246?w=400&q=80", type:"spicy" },
  { id:4, name:"Sate Ayam Madura", price:30000, badge:"Premium", cat:"food",
    desc:"10 tusuk sate ayam dengan bumbu kacang legit.",
    img:"https://images.unsplash.com/photo-1529563021893-cc83c992d75d?w=400&q=80", type:"none" },
  { id:5, name:"Ikan Bakar Rica", price:32000, badge:"Spesial", cat:"food",
    desc:"Ikan bakar bumbu rica pedas khas Manado.",
    img:"https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?w=400&q=80", type:"spicy" },
  { id:6, name:"Bakso Sapi Jumbo", price:22000, badge:"Kuah", cat:"food",
    desc:"Bakso sapi urat jumbo dengan kuah kaldu gurih.",
    img:"https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=400&q=80", type:"none" },

  /* --- MINUMAN --- */
  { id:7, name:"Es Teh Manis", price:5000, badge:"Segar", cat:"drink",
    desc:"Teh manis dingin, pelepas dahaga paling pas.",
    img:"https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=400&q=80", type:"sweet" },
  { id:8, name:"Es Nutrisari", price:7000, badge:"Favorit", cat:"drink",
    desc:"Minuman jeruk segar dari Nutrisari, dingin menyegarkan.",
    img:"https://images.unsplash.com/photo-1600271886742-f049cd451bba?w=400&q=80", type:"sweet" },
  { id:9, name:"Es Teh Tawar", price:3000, badge:"Hemat", cat:"drink",
    desc:"Teh tawar dingin tanpa gula, cocok untuk diet.",
    img:"https://images.unsplash.com/photo-1571934811356-5cc061b6821f?w=400&q=80", type:"none" },
  { id:10, name:"Es Jeruk Peras", price:8000, badge:"Fresh", cat:"drink",
    desc:"Jeruk peras asli dengan es batu, segar alami.",
    img:"https://images.unsplash.com/photo-1613478223719-2ab802602423?w=400&q=80", type:"sweet" }
];

let cart = [];
let currentCat = 'food';

/* ============ RENDER MENU ============ */
const grid = document.getElementById('menuGrid');

function levelButtonsHtml(type) {
  let html = '';
  const cls = type === 'sweet' ? 'level-btn sweet' : 'level-btn';
  for (let l = 1; l <= MAX_LEVEL; l++) {
    html += `<button class="${cls}" data-lvl="${l}">${l}</button>`;
  }
  return html;
}

function renderMenu() {
  const filtered = currentCat === 'all'
    ? PRODUCTS
    : PRODUCTS.filter(p => p.cat === currentCat);

  grid.innerHTML = filtered.map(p => {
    const isDrink = p.cat === 'drink';
    const hasLevel = p.type === 'spicy' || p.type === 'sweet';
    const levelLabel = p.type === 'spicy' ? '🌶️ Level pedas' : '🍬 Level manis';

    return `
    <div class="card3d" data-id="${p.id}">
      <div class="img-wrap">
        <span class="badge ${isDrink ? 'drink' : ''}">${p.badge}</span>
        <img src="${p.img}" alt="${p.name}" loading="lazy">
      </div>
      <div class="card-body">
        <h3>${p.name}</h3>
        <div class="desc">${p.desc}</div>
        <div class="price">
          Rp ${p.price.toLocaleString('id-ID')}
          ${hasLevel ? `<span class="price-note">+ level</span>` : ''}
        </div>

        ${hasLevel ? `
          <div class="level-row">
            <div class="level-label">
              <span>${levelLabel}</span>
              <span class="extra" data-extra="${p.id}">+Rp 0</span>
            </div>
            <div class="level-btns">${levelButtonsHtml(p.type)}</div>
          </div>
        ` : ''}

        <div class="qty-row">
          <div class="qty-box">
            <button data-act="minus">−</button>
            <span class="num">1</span>
            <button data-act="plus">+</button>
          </div>
          <button class="add-btn ${isDrink ? 'drink' : ''}">Tambah</button>
        </div>
      </div>
    </div>
  `;
  }).join('');

  document.getElementById('menuCount').textContent = filtered.length + ' menu tersedia';
}

/* ============ TAB KATEGORI ============ */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentCat = tab.dataset.cat;

    const titles = { food:'Menu Makanan 🍛', drink:'Menu Minuman 🥤', all:'Semua Menu 📋' };
    document.getElementById('sectionTitle').textContent = titles[currentCat];

    renderMenu();
    bindTilt();
  });
});

/* ============ INTERAKSI ============ */
grid.addEventListener('click', (e) => {
  const card = e.target.closest('.card3d');
  if (!card) return;
  const id = +card.dataset.id;

  // Klik level
  if (e.target.classList.contains('level-btn')) {
    const row = e.target.closest('.level-row');
    row.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');

    const level = +e.target.dataset.lvl;
    const extra = levelExtra(level);
    const extraEl = card.querySelector('.level-label .extra');
    extraEl.textContent = extra > 0 ? '+Rp ' + extra.toLocaleString('id-ID') : '+Rp 0';
    extraEl.classList.toggle('free', extra === 0);
    return;
  }

  // Klik qty
  if (e.target.dataset.act) {
    const numEl = card.querySelector('.num');
    let n = +numEl.textContent;
    if (e.target.dataset.act === 'plus') n = Math.min(n + 1, 20);
    if (e.target.dataset.act === 'minus') n = Math.max(n - 1, 1);
    numEl.textContent = n;
    return;
  }

  // Klik tambah
  if (e.target.classList.contains('add-btn')) {
    const qty = +card.querySelector('.num').textContent;
    let level = null;
    const row = card.querySelector('.level-row');
    if (row) {
      const active = row.querySelector('.level-btn.active');
      if (!active) {
        const p = PRODUCTS.find(pr => pr.id === id);
        showToast(p.type === 'sweet' ? 'Pilih level manis dulu 🍬' : 'Pilih level pedas dulu 🌶️');
        return;
      }
      level = +active.dataset.lvl;
    }
    addToCart(id, qty, level);
    card.querySelector('.num').textContent = 1;
    if (row) {
      row.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
      const extraEl = card.querySelector('.level-label .extra');
      extraEl.textContent = '+Rp 0';
      extraEl.classList.add('free');
    }
    showToast(`${PRODUCTS.find(p => p.id === id).name} ditambahkan ✓`);
  }
});

/* ============ TILT 3D ============ */
function bindTilt() {
  document.querySelectorAll('.card3d').forEach(card => {
    card.addEventListener('mousemove', (e) => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      card.style.transform = `rotateY(${x * 12}deg) rotateX(${-y * 12}deg) translateZ(14px)`;
    });
    card.addEventListener('mouseleave', () => { card.style.transform = ''; });
  });
}

/* ============ KERANJANG ============ */
function addToCart(productId, qty, level) {
  const key = productId + '-' + (level || 0);
  const exist = cart.find(c => c.key === key);
  if (exist) exist.qty = Math.min(exist.qty + qty, 99);
  else cart.push({ key, productId, qty, level });
  updateCartUI();
}

function changeQty(key, delta) {
  const item = cart.find(c => c.key === key);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) cart = cart.filter(c => c.key !== key);
  updateCartUI();
}

function itemPrice(item) {
  const p = PRODUCTS.find(pr => pr.id === item.productId);
  return (p.price + levelExtra(item.level)) * item.qty;
}
function getTotal() {
  return cart.reduce((s, i) => s + itemPrice(i), 0);
}

function updateCartUI() {
  const list = document.getElementById('cartList');
  const countEl = document.getElementById('cartCount');
  const totalEl = document.getElementById('grandTotal');
  const btn = document.getElementById('checkoutBtn');

  const totalQty = cart.reduce((s, c) => s + c.qty, 0);
  countEl.textContent = totalQty + ' item';

  if (cart.length === 0) {
    list.innerHTML = `<div class="cart-empty"><span>🛒</span>Keranjang masih kosong.<br>Yuk pilih menu favoritmu!</div>`;
    totalEl.textContent = 'Rp 0';
    btn.disabled = true;
    return;
  }

  list.innerHTML = cart.map(item => {
    const p = PRODUCTS.find(pr => pr.id === item.productId);
    const extra = levelExtra(item.level);
    const lvlCls = p.type === 'sweet' ? 'sweet' : 'lvl';
    const lvlIcon = p.type === 'sweet' ? '🍬' : '🌶️';
    const lvlText = p.type === 'sweet' ? 'Manis' : 'Level';

    return `
      <div class="cart-item">
        <img src="${p.img}" alt="${p.name}">
        <div class="info">
          <h4>${p.name}</h4>
          ${item.level ? `<small class="${lvlCls}">${lvlIcon} ${lvlText} ${item.level} ${extra ? '(+Rp ' + extra.toLocaleString('id-ID') + ')' : ''}</small>` : ''}
          <div class="sub">Rp ${itemPrice(item).toLocaleString('id-ID')}</div>
        </div>
        <div class="qty-mini">
          <button data-key="${item.key}" data-delta="-1">−</button>
          <span>${item.qty}</span>
          <button data-key="${item.key}" data-delta="1">+</button>
        </div>
      </div>`;
  }).join('');

  totalEl.textContent = 'Rp ' + getTotal().toLocaleString('id-ID');
  btn.disabled = false;
}

document.getElementById('cartList').addEventListener('click', (e) => {
  if (e.target.dataset.key) changeQty(e.target.dataset.key, +e.target.dataset.delta);
});

/* ============ CHECKOUT WHATSAPP ============ */
document.getElementById('checkoutBtn').addEventListener('click', () => {
  if (!cart.length) return;

  let pesan = 'Halo Dapur Pedas! Saya mau pesan:%0A%0A';
  cart.forEach(item => {
    const p = PRODUCTS.find(pr => pr.id === item.productId);
    const extra = levelExtra(item.level);
    let lvTxt = '';
    if (item.level) {
      const label = p.type === 'sweet' ? 'Manis' : 'Level';
      lvTxt = ` (${label} ${item.level}${extra ? ' +Rp ' + extra.toLocaleString('id-ID') : ''})`;
    }
    pesan += `• ${p.name}${lvTxt} x${item.qty} = Rp ${itemPrice(item).toLocaleString('id-ID')}%0A`;
  });
  pesan += `%0A*Total: Rp ${getTotal().toLocaleString('id-ID')}*%0A%0AMohon diproses ya! 🙏`;

  const url = `https://api.whatsapp.com/send?phone=${NOMOR_WA}&text=${pesan}`;
  window.open(url, '_blank');
});

/* ============ TOAST ============ */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ============ INIT ============ */
renderMenu();
bindTilt();
updateCartUI();
</script>
</body>
</html>
